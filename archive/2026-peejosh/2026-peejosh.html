<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duke Omotola Administration | SERVICOM CDS Osogbo</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    .archive-header {
      text-align: center;
      margin-bottom: 40px;
      padding: 0 20px;
    }

    .archive-title {
      font-size: 2.2rem;
      color: var(--primary-color);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .archive-subtitle {
      color: #555;
      max-width: 700px;
      margin: auto;
    }

    .section-box {
      background: var(--light-color);
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 40px;
    }

    .executive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .executive-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .executive-card:hover {
      transform: translateY(-5px);
    }

    .executive-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .executive-info {
      padding: 15px;
      text-align: center;
    }

    .executive-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .executive-position {
      color: var(--nysc-green);
      font-weight: 500;
    }

    .activities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .activity-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .activity-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .activity-content {
      padding: 15px;
    }

    .activity-date {
      background: var(--nysc-green);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .activity-title {
      font-size: 1.1rem;
      margin: 5px 0;
      color: var(--dark-color);
    }

    .activity-desc {
      font-size: 0.9rem;
      color: #666;
    }

    .read-more {
      color: var(--secondary-color);
      text-decoration: none;
      font-weight: bold;
    }

    .timeline-item {
      margin-bottom: 15px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .timeline-item strong {
      color: var(--primary-color);
    }

    .back-btn {
      display: inline-block;
      background: var(--nysc-green);
      color: white;
      padding: 12px 25px;
      border-radius: 30px;
      text-decoration: none;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .back-btn:hover {
      background: #2e7d32;
      transform: translateY(-3px);
    }
  </style>
</head>

<body>

<div id="header-placeholder"></div>

<section class="section">

  <div class="archive-header">
    <h1 class="archive-title">Duke Omotola Administration</h1>
    <p class="archive-subtitle">A legacy of service, integrity, and community impact</p>
  </div>

  <!-- EXECUTIVES -->
  <div class="section-box">
    <h2 style="text-align:center; color: var(--primary-color);">Executive Committee</h2>
    <div class="executive-grid" id="executive-grid"></div>
  </div>

  <!-- ACTIVITIES -->
  <div class="section-box">
    <h2 style="text-align:center; color: var(--primary-color);">Activities</h2>
    <div class="activities-grid" id="activities-grid"></div>
  </div>

  <!-- TIMELINE -->
  <div class="section-box">
    <h2 style="text-align:center; color: var(--primary-color);">Timeline</h2>
    <div id="timeline"></div>
  </div>

  <div style="text-align:center;">
    <a href="./archive.html" class="back-btn">← Return</a>
  </div>

</section>

<div id="footer-placeholder"></div>

<script src="./includes/loader.js"></script>

<!-- ===================== EXECUTIVES ===================== -->
<script>
fetch('./exco.json')
  .then(res => res.json())
  .then(data => {
    const grid = document.getElementById('executive-grid');
    grid.innerHTML = "";

    data.executives.forEach(member => {
      grid.innerHTML += `
        <div class="executive-card">
          <img src="${member.image}" alt="${member.name}">
          <div class="executive-info">
            <div class="executive-name">${member.name}</div>
            <div class="executive-position">${member.position}</div>
          </div>
        </div>
      `;
    });
  })
  .catch(err => {
    console.error("EXCO ERROR:", err);
    document.getElementById('executive-grid').innerHTML =
      "<p style='text-align:center;'>Failed to load executives</p>";
  });
</script>

<!-- ===================== ACTIVITIES ===================== -->
<script>
fetch('./activities.json')
  .then(res => res.json())
  .then(data => {
    const grid = document.getElementById('activities-grid');
    grid.innerHTML = "";

    data.activities.forEach(act => {
      grid.innerHTML += `
        <div class="activity-card">
          <img class="activity-img" src="${act.flyer}">
          <div class="activity-content">
            <span class="activity-date">${act.date}</span>
            <h3 class="activity-title">${act.title}</h3>
            <p class="activity-desc">${act.description}</p>
            <a class="read-more" href="${act.pageUrl}">Read More →</a>
          </div>
        </div>
      `;
    });
  })
  .catch(err => {
    document.getElementById('activities-grid').innerHTML =
      "<p>No activities found</p>";
  });
</script>

<!-- ===================== TIMELINE ===================== -->
<script>
fetch('./activities.json')
  .then(res => res.json())
  .then(data => {
    const timeline = document.getElementById('timeline');
    timeline.innerHTML = "";

    const sorted = [...data.activities].sort((a, b) =>
      new Date(b.date) - new Date(a.date)
    );

    sorted.forEach((act, i) => {
      timeline.innerHTML += `
        <div class="timeline-item">
          <strong>${act.title}</strong>
          <p>${act.description}</p>
        </div>
      `;
    });
  })
  .catch(err => {
    document.getElementById('timeline').innerHTML =
      "<p>Timeline unavailable</p>";
  });
</script>

</body>
</html>
